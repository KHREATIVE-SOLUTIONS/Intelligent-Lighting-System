<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILS Visualizer - Intelligent Lighting System</title>
    <link rel="stylesheet" href="/css/visualizer.css">
    <style>
        body { margin: 0; padding: 0; background: #050508; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #container { width: 100vw; height: 100vh; position: relative; }
        #visualizer { width: 100%; height: 100%; display: block; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        #loading.hidden { display: none; }
        #overlay { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; }
        #header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: linear-gradient(to bottom, rgba(5,5,8,0.9) 0%, transparent 100%); }
        #header h1 { font-size: 1.4rem; font-weight: 300; letter-spacing: 3px; color: #888; }
        #status { display: flex; gap: 15px; font-size: 0.8rem; font-family: monospace; }
        #connection-status { padding: 4px 10px; border-radius: 10px; font-weight: 500; }
        #connection-status.connected { background: #0d2818; color: #4ade80; }
        #connection-status.disconnected { background: #2d1515; color: #f87171; }
        #fps { color: #666; }
        #controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 8px; align-items: center; pointer-events: auto; }
        #controls button { padding: 8px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #aaa; border-radius: 5px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        #controls button:hover { background: rgba(255,255,255,0.15); color: #fff; }
        #controls label { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: rgba(255,255,255,0.08); border-radius: 5px; cursor: pointer; font-size: 0.8rem; color: #aaa; }
        #gpu-info { position: absolute; bottom: 20px; right: 20px; color: #333; font-size: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">
            <h2>Loading ILS Visualizer...</h2>
            <p style="color:#666">Initializing WebGL renderer</p>
        </div>
        <canvas id="visualizer"></canvas>
        <div id="overlay">
            <div id="header">
                <h1>ILS VISUALIZER</h1>
                <div id="status">
                    <span id="connection-status" class="disconnected">Disconnected</span>
                    <span id="fps">0 FPS</span>
                </div>
            </div>
            <div id="controls">
                <button id="btn-reset-camera">Reset View</button>
                <button id="btn-toggle-grid">Grid</button>
                <button id="btn-toggle-labels">Labels</button>
                <label>
                    <input type="checkbox" id="chk-test-mode"> Test Mode
                </label>
                <label>
                    <input type="checkbox" id="chk-diagnostic-show-mode"> Diagnostic Show
                </label>
                <a href="/operator.html" style="padding: 8px 14px; background: rgba(255,100,100,0.15); border: 1px solid rgba(255,100,100,0.3); color: #f88; border-radius: 5px; text-decoration: none; font-size: 0.8rem; pointer-events: auto;">Operator Console</a>
            </div>
        </div>
        <div id="gpu-info"></div>
    </div>

    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- ILS Visualizer -->
    <script src="/js/fixtures.js"></script>
    <script src="/js/volumetric-beam.js"></script>
    <script src="/js/visualizer-optimized.js"></script>
</body>
</html>
