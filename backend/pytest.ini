[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# An xfail that starts passing is a result, not a pass. Without this a contract
# target that has been met stays green after it silently regresses back to
# failing, which makes the whole xfail-as-acceptance scheme unfalsifiable.
xfail_strict = true
markers =
    wire: boots the real backend as a subprocess and judges the Art-Net it sends, in real time. Skipped unless --wire or ILS_WIRE=1.
