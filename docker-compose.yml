services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lighting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: lighting_db
    # Not published: the backend reaches it on the compose network. Publishing it
    # put a database with a known password on the venue network, and anyone who
    # can write the credential table can sign in as the operator. The dev
    # override example publishes it on 127.0.0.1 only.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: lighting-redis
    restart: unless-stopped
    # Not published (no password). Reachable by the other containers only.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lighting-backend
    restart: unless-stopped
    # Operators reach the API through the frontend on port 80 (nginx proxies /api
    # and /ws), so the backend itself only listens on this machine.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lighting_db
      - REDIS_URL=redis://redis:6379
      - DEBUG=${DEBUG:-false}
      # Operator login is on. For local development copy
      # docker-compose.override.example.yml to docker-compose.override.yml, or
      # run with AUTH_ENABLED=false in the shell.
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:80","http://localhost"]
      # Art-Net leaves a container's bridge network by unicast only, so set this
      # to your node's IP. Broadcast (the default) needs the Linux venue file:
      # docker-compose.venue-linux.example.yml.
      - ARTNET_IP=${ARTNET_IP:-255.255.255.255}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./ml_models:/app/ml_models
      - ./data:/data
      - ./visualizer:/app/visualizer:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # The image has no curl, so a curl check left the backend unhealthy for ever.
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 3D Visualizer (FastAPI + WebSocket relay)
  visualizer:
    image: python:3.11-slim
    container_name: lighting-visualizer
    restart: unless-stopped
    working_dir: /visualizer
    # The visualizer relays to the backend with its own token and has no login of
    # its own, so it stays on this machine.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./visualizer:/visualizer
    environment:
      - ILS_BACKEND_URL=http://backend:8000
      # With login on, paste an operator token here (from POST /api/auth/login).
      - ILS_TOKEN=${ILS_TOKEN:-}
    command: >
      bash -c "pip install --quiet fastapi uvicorn aiohttp websockets &&
               python server.py"
    depends_on:
      - backend

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lighting-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development frontend (optional - for hot reload)
  frontend-dev:
    image: node:20-alpine
    container_name: lighting-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
